name: Publish

on:
  push:
    branches: [main]
    paths:
      - packages/astro-og-seo/package.json

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp run astro-og-seo#build
      - name: Publish astro-og-seo
        working-directory: packages/astro-og-seo
        run: npm publish --provenance --access public
